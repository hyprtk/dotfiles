[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtk-term"
dynamic = ["version"]
description = "A fast, theme-aware terminal emulator for the hyprtk desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
hyprtk-term = "hyprtk_term.__main__:main"

[tool.setuptools]
packages = ["hyprtk_term"]

[tool.setuptools.package-data]
hyprtk_term = [
    "qml/*.qml",
    "qml/theme/*",
    "qml/components/*",
    "assets/fonts/*.ttf",
    "assets/*.svg",
]

[tool.setuptools.dynamic]
version = { attr = "hyprtk_term.__version__" }

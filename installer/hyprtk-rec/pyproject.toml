[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtk-rec"
dynamic = ["version"]
description = "A Wayland-native screen recorder for the hyprtk desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
hyprtk-rec = "hyprtk_rec.__main__:main"

[tool.setuptools]
packages = ["hyprtk_rec"]

[tool.setuptools.package-data]
hyprtk_rec = [
    "qml/*.qml",
    "qml/components/*",
    "assets/*.svg",
    "assets/fonts/*.ttf",
]

[tool.setuptools.dynamic]
version = { attr = "hyprtk_rec.__version__" }

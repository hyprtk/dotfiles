[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtk-editor"
dynamic = ["version"]
description = "A fast, theme-aware text editor for the hyprtk desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygments>=2.14"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
hyprtk-edit = "hyprtk_editor.__main__:main"

[tool.setuptools]
packages = ["hyprtk_editor"]

[tool.setuptools.package-data]
hyprtk_editor = [
    "qml/*.qml",
    "qml/theme/*",
    "qml/components/*",
    "assets/fonts/*.ttf",
    "assets/*.svg",
]

[tool.setuptools.dynamic]
version = { attr = "hyprtk_editor.__version__" }

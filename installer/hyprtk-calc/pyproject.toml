[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtk-calc"
dynamic = ["version"]
description = "An exact, theme-aware calculator for the hyprtk desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
hyprtk-calc = "hyprtk_calc.__main__:main"

[tool.setuptools]
packages = ["hyprtk_calc"]

[tool.setuptools.package-data]
hyprtk_calc = [
    "qml/*.qml",
    "qml/theme/*",
    "qml/components/*",
    "assets/fonts/*.ttf",
    "assets/*.svg",
]

[tool.setuptools.dynamic]
version = { attr = "hyprtk_calc.__version__" }
